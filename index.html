<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FiveIN - Pro Rotation Tracker</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 900: '#111827', 800: '#1f2937', 700: '#374151' } } } }
        }
    </script>

    <style>
        @font-face {
            font-family: 'DS-Digital';
            src: url('https://fonts.cdnfonts.com/s/14352/DS-DIGI.woff') format('woff');
            font-weight: normal; font-style: normal;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; overscroll-behavior-y: contain; }
        
        /* CAMPO */
        .court-area {
            background-color: #eebb88;
            background-image: repeating-linear-gradient(0deg, transparent 0px, transparent 58px, rgba(160, 82, 45, 0.15) 59px, rgba(160, 82, 45, 0.15) 60px), repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 30px, transparent 30px, transparent 60px);
            border: 6px solid #ffffff; box-shadow: inset 0 0 60px rgba(0,0,0,0.15); position: relative; min-height: 420px;
        }
        .dark .court-area { background-color: #cfa06b; border-color: #e2e8f0; }
        
        /* SCHEDE */
        .player-card { touch-action: manipulation; cursor: pointer; transition: transform 0.1s; z-index: 10; border: 1px solid rgba(0,0,0,0.1); }
        .player-card.on-court { background: #1e293b; color: white; border: 1px solid #475569; }
        .dark .player-card:not(.on-court) { background: #111827; color: #f1f5f9; }
        .selected-card { outline: 5px solid #ccff00 !important; transform: scale(1.05); z-index: 50; }
        
        .timer-display { font-family: 'DS-Digital', monospace; font-size: 3.5rem; color: #ef4444; line-height: 1; }
        
        /* BOX DATI TEMPO NELLE SCHEDE */
        .time-box { background: rgba(0,0,0,0.05); border-radius: 6px; padding: 4px; border: 1px solid rgba(0,0,0,0.05); }
        .on-court .time-box { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
        
        /* TIMELINE GRAFICA CON QUARTI */
        .timeline-bar { height: 18px; border-radius: 4px; position: relative; background: #e2e8f0; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        .dark .timeline-bar { background: #1f2937; border-color: rgba(255,255,255,0.05); }
        .stint-segment { position: absolute; height: 100%; background: #3b82f6; z-index: 10; }
        .quarter-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.2); z-index: 20; }
        .dark .quarter-line { background: rgba(255,255,255,0.2); }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="p-2 sm:p-4 bg-gray-100 dark:bg-gray-900 select-none min-h-screen">

    <div class="max-w-7xl mx-auto flex flex-col gap-4">
        
        <header class="flex justify-between items-center py-2">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-gray-800 dark:text-white">🏀 FiveIN</h1>
                <input type="text" id="opponent-name" placeholder="Avversaria" class="bg-white dark:bg-gray-700 border dark:border-gray-600 text-sm py-1 px-3 rounded-lg outline-none text-white">
            </div>
            <div class="flex gap-2">
                <button onclick="exportToCSV()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider shadow-lg transition">Scarica CSV</button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-sm text-yellow-500">🌙</button>
            </div>
        </header>

        <div id="setup-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[100] hidden">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
                <h2 class="text-xl font-bold mb-4 dark:text-white">Inserisci Roster (N. Nome)</h2>
                <textarea id="player-input" rows="10" class="w-full p-4 border rounded-xl bg-gray-50 dark:bg-gray-700 dark:text-white font-mono text-sm">00 Leardini
7 Tomassini
11 Denegri
12 Sankare
13 Marini
17 Ogden
18 Pollone
22 Robinson
27 Simioni
29 Camara</textarea>
                <button onclick="initializeGame()" class="mt-4 w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition">INIZIA PARTITA</button>
            </div>
        </div>

        <div id="game-container" class="hidden flex flex-col gap-4">
            
            <div class="bg-white dark:bg-gray-800 p-3 sm:p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-wrap sm:flex-nowrap justify-between items-center gap-4">
                <div class="flex gap-2 order-3 sm:order-1">
                    <button id="start-pause-btn" onclick="toggleTimer()" class="bg-green-600 text-white font-bold py-3 px-4 rounded-xl w-24 shadow-md">AVVIA</button>
                    <button id="undo-btn" onclick="undoSubstitution()" class="bg-orange-500 text-white font-bold py-3 px-4 rounded-xl w-24 opacity-50 cursor-not-allowed">UNDO</button>
                    <button onclick="if(confirm('Reset?')) { localStorage.clear(); location.reload(); }" class="bg-red-500 text-white font-bold py-3 px-4 rounded-xl">RESET</button>
                </div>

                <div class="flex-1 flex justify-center items-center gap-3 order-1 sm:order-2">
                    <button onclick="adjustTime(30000)" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 font-bold text-gray-500 text-xs">+30"</button>
                    <div class="text-center min-w-[200px]">
                        <span id="timer-display" class="timer-display">10:00</span>
                    </div>
                    <button onclick="adjustTime(-30000)" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 font-bold text-gray-500 text-xs">-30"</button>
                </div>

                <div class="order-2 sm:order-3">
                    <select id="quarter-select" onchange="changeQuarter()" class="bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 text-gray-800 dark:text-white font-black text-xl py-2 px-4 rounded-xl outline-none">
                        <option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3">Q3</option><option value="Q4">Q4</option><option value="OT">OT</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
                <div id="bench-area" class="lg:col-span-3 bench-area p-3 rounded-2xl grid grid-cols-2 lg:grid-cols-1 gap-2 overflow-y-auto max-h-[600px] custom-scroll"></div>
                
                <div class="lg:col-span-9 flex flex-col gap-4">
                    <div class="court-area rounded-3xl p-6 relative">
                        <div id="court-area" class="relative z-10 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 h-full items-start"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                            <div id="total-stats-area" class="overflow-x-auto custom-scroll"></div>
                        </div>

                        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Dettaglio Rotazioni (4 Quarti)</h3>
                                <div class="flex gap-4 text-[9px] font-bold text-gray-400 uppercase">
                                    <span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span>
                                </div>
                            </div>
                            <div id="rotation-timeline" class="space-y-3"></div>
                            <div class="relative h-4 mt-2 border-t pt-1">
                                <div class="absolute left-0 text-[9px] text-gray-500">0'</div>
                                <div class="absolute left-1/4 text-[9px] text-gray-500">10'</div>
                                <div class="absolute left-1/2 text-[9px] text-gray-500">20'</div>
                                <div class="absolute left-3/4 text-[9px] text-gray-500">30'</div>
                                <div class="absolute right-0 text-[9px] text-gray-500">40'</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIX_LOOKUP = [
            {l:16, v:1.00},{l:34, v:1.01},{l:47, v:1.02},{l:59, v:1.03},{l:70, v:1.04},{l:81, v:1.05},{l:90, v:1.06},{l:99, v:1.07},{l:108, v:1.08},{l:116, v:1.09},{l:124, v:1.10},
            {l:132, v:1.11},{l:140, v:1.12},{l:147, v:1.13},{l:154, v:1.14},{l:161, v:1.15},{l:168, v:1.16},{l:175, v:1.17},{l:182, v:1.18},{l:188, v:1.19},{l:194, v:1.20},
            {l:300, v:1.39},{l:420, v:1.65},{l:540, v:1.95},{l:600, v:2.10},{l:9999, v:2.11}
        ];

        let gameState = { players: [], isRunning: false, lastUpdateTime: 0, currentQuarter: 'Q1', quarterTimes: {} };
        let history = []; 
        let timerInterval = null;
        let selectedPlayerId = null;

        function getFatigueMultiplier(idx, totMin) {
            const s = idx + 1;
            if (s === 1) return 1.0;
            if (s === 2) return totMin <= 4 ? 1.005 : (totMin <= 6 ? 1.007 : (totMin <= 8 ? 1.010 : 1.012));
            if (s === 3) return totMin <= 4 ? 1.003 : (totMin <= 6 ? 1.005 : (totMin <= 8 ? 1.008 : (totMin <= 10 ? 1.010 : (totMin <= 12 ? 1.013 : (totMin <= 14 ? 1.014 : (totMin <= 16 ? 1.016 : (totMin <= 18 ? 1.018 : 1.020)))))));
            if (s === 4) return totMin <= 6 ? 1.0 : (totMin <= 8 ? 1.005 : (totMin <= 10 ? 1.008 : (totMin <= 12 ? 1.010 : (totMin <= 14 ? 1.013 : (totMin <= 16 ? 1.016 : (totMin <= 18 ? 1.018 : (totMin <= 20 ? 1.020 : (totMin <= 22 ? 1.023 : (totMin <= 24 ? 1.026 : (totMin <= 28 ? 1.030 : 1.035))))))))));
            if (s >= 5) return totMin <= 8 ? 1.0 : (totMin <= 12 ? 1.002 : (totMin <= 16 ? 1.005 : (totMin <= 18 ? 1.010 : (totMin <= 20 ? 1.012 : (totMin <= 22 ? 1.015 : (totMin <= 24 ? 1.020 : (totMin <= 28 ? 1.025 : 1.035)))))));
            return 1.0;
        }

        function calcTGL(player) {
            let tgl = 0, totMinBefore = 0, stints = [];
            player.performance.forEach(perf => {
                perf.rotations.forEach(r => {
                    let d = r.end !== null ? r.end - r.start : (perf.quarter === gameState.currentQuarter && player.status === 'court' ? (600000 - gameState.quarterTimes[gameState.currentQuarter]) - r.start : 0);
                    if (d > 0) stints.push(d / 1000);
                });
            });
            stints.forEach((sec, i) => {
                const fix = (FIX_LOOKUP.find(e => sec <= e.l) || {v:2.11}).v;
                tgl += (sec * fix * getFatigueMultiplier(i, totMinBefore));
                totMinBefore += (sec / 60);
            });
            return Math.round(tgl);
        }

        function calcTotalMs(player) {
            return player.performance.reduce((acc, p) => acc + p.rotations.reduce((rAcc, r) => {
                let d = r.end !== null ? r.end - r.start : (p.quarter === gameState.currentQuarter && player.status === 'court' ? (600000 - gameState.quarterTimes[gameState.currentQuarter]) - r.start : 0);
                return rAcc + (d > 0 ? d : 0);
            }, 0), 0);
        }

        function getCurrentStintMs(player) {
            if (player.status !== 'court') return 0;
            const perf = player.performance.find(p => p.quarter === gameState.currentQuarter);
            if (!perf) return 0;
            const last = perf.rotations[perf.rotations.length - 1];
            return (last && last.end === null) ? (600000 - gameState.quarterTimes[gameState.currentQuarter]) - last.start : 0;
        }

        function handlePlayerClick(id) {
            const p = gameState.players.find(x => x.id === id);
            if (selectedPlayerId === null) { selectedPlayerId = id; } 
            else if (selectedPlayerId === id) { selectedPlayerId = null; } 
            else {
                const p1 = gameState.players.find(x => x.id === selectedPlayerId);
                if (p1.status !== p.status) { performSubstitution(p1, p); selectedPlayerId = null; } 
                else { selectedPlayerId = id; }
            }
            updateUI();
        }

        function performSubstitution(p1, p2) {
            saveToHistory();
            const now = 600000 - gameState.quarterTimes[gameState.currentQuarter];
            const courtP = p1.status === 'court' ? p1 : p2;
            const benchP = p1.status === 'bench' ? p1 : p2;

            let perfOut = courtP.performance.find(x => x.quarter === gameState.currentQuarter);
            if (perfOut) {
                let last = perfOut.rotations[perfOut.rotations.length - 1];
                if (last && last.end === null) last.end = now;
            }
            courtP.status = 'bench';

            let perfIn = benchP.performance.find(x => x.quarter === gameState.currentQuarter);
            if (!perfIn) { perfIn = { quarter: gameState.currentQuarter, rotations: [] }; benchP.performance.push(perfIn); }
            perfIn.rotations.push({ start: now, end: null });
            benchP.status = 'court';

            localStorage.setItem('basket_rotation_fivein_v2', JSON.stringify(gameState));
        }

        function saveToHistory() {
            history.push(JSON.parse(JSON.stringify(gameState)));
            if (history.length > 20) history.shift();
            updateUndoButton();
        }

        function undoSubstitution() {
            if (history.length > 0) {
                gameState = history.pop();
                updateUI();
                updateUndoButton();
                localStorage.setItem('basket_rotation_fivein_v2', JSON.stringify(gameState));
            }
        }

        function updateUndoButton() {
            const btn = document.getElementById('undo-btn');
            if (history.length > 0) { btn.classList.remove('opacity-50', 'cursor-not-allowed'); } 
            else { btn.classList.add('opacity-50', 'cursor-not-allowed'); }
        }

        function toggleTimer() {
            if (gameState.isRunning) { clearInterval(timerInterval); gameState.isRunning = false; }
            else { gameState.lastUpdateTime = Date.now(); timerInterval = setInterval(updateTimer, 100); gameState.isRunning = true; }
            document.getElementById('start-pause-btn').innerText = gameState.isRunning ? 'PAUSA' : 'AVVIA';
            document.getElementById('start-pause-btn').className = gameState.isRunning ? 'bg-yellow-600 text-white font-bold py-3 px-4 rounded-xl w-24' : 'bg-green-600 text-white font-bold py-3 px-4 rounded-xl w-24';
        }

        function updateTimer() {
            const delta = Date.now() - gameState.lastUpdateTime;
            gameState.lastUpdateTime = Date.now();
            gameState.quarterTimes[gameState.currentQuarter] = Math.max(0, gameState.quarterTimes[gameState.currentQuarter] - delta);
            if (gameState.quarterTimes[gameState.currentQuarter] === 0) { toggleTimer(); }
            updateUI();
        }

        function changeQuarter() {
            const oldQ = gameState.currentQuarter;
            const newQ = document.getElementById('quarter-select').value;
            
            gameState.players.filter(p => p.status === 'court').forEach(p => {
                let perf = p.performance.find(x => x.quarter === oldQ);
                if (perf) {
                    let last = perf.rotations[perf.rotations.length - 1];
                    if (last && last.end === null) last.end = 600000 - gameState.quarterTimes[oldQ];
                }
            });

            gameState.currentQuarter = newQ;
            const nowInNew = 600000 - gameState.quarterTimes[newQ];

            gameState.players.filter(p => p.status === 'court').forEach(p => {
                let perf = p.performance.find(x => x.quarter === newQ);
                if (!perf) {
                    perf = { quarter: newQ, rotations: [{ start: nowInNew, end: null }] };
                    p.performance.push(perf);
                } else {
                    let last = perf.rotations[perf.rotations.length - 1];
                    if (!last || last.end !== null) perf.rotations.push({ start: nowInNew, end: null });
                }
            });

            updateUI();
            localStorage.setItem('basket_rotation_fivein_v2', JSON.stringify(gameState));
        }

        function updateUI() {
            document.getElementById('timer-display').innerText = formatTime(gameState.quarterTimes[gameState.currentQuarter]);
            const court = document.getElementById('court-area'), bench = document.getElementById('bench-area');
            court.innerHTML = ''; bench.innerHTML = '';

            gameState.players.forEach(p => {
                const tgl = calcTGL(p), tot = calcTotalMs(p), stint = getCurrentStintMs(p);
                let tglColor = 'text-green-600';
                if (tgl > 4832) tglColor = 'text-red-600'; else if (tgl > 3695) tglColor = 'text-orange-500'; else if (tgl > 2274) tglColor = 'text-yellow-500';

                const card = `
                    <div onclick="handlePlayerClick(${p.id})" class="player-card ${p.status === 'court' ? 'on-court' : ''} ${selectedPlayerId === p.id ? 'selected-card' : ''} p-4 rounded-xl flex flex-col justify-between shadow-sm border border-gray-200 dark:border-gray-700">
                        <div class="flex justify-between items-start">
                            <span class="text-2xl font-black ${p.status === 'court' ? 'text-yellow-400' : 'text-gray-400'}">${p.number}</span>
                            <div class="text-right">
                                <p class="text-[8px] uppercase font-black opacity-50">Load</p>
                                <p class="text-xl font-black ${tglColor}">${tgl}</p>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm truncate my-2">${p.name}</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="time-box flex flex-col items-center">
                                <span class="text-[7px] uppercase font-bold opacity-60">Total</span>
                                <span class="text-xs font-mono font-black">${formatTime(tot)}</span>
                            </div>
                            <div class="time-box flex flex-col items-center ${p.status === 'court' ? '' : 'opacity-0'}">
                                <span class="text-[7px] uppercase font-bold opacity-60">Stint</span>
                                <span class="text-xs font-mono font-black ${stint > 420000 ? 'text-red-500 animate-pulse' : ''}">${formatTime(stint)}</span>
                            </div>
                        </div>
                    </div>`;
                p.status === 'court' ? court.innerHTML += card : bench.innerHTML += card;
            });
            renderTable();
            renderTimeline();
        }

        function renderTable() {
            let html = `<table class="w-full text-[11px] text-left dark:text-gray-300">
                <thead class="bg-gray-50 dark:bg-gray-700/50 uppercase text-gray-500">
                    <tr><th class="px-4 py-3">#</th><th class="px-4 py-3">Giocatore</th><th class="px-4 py-3 text-right">Q1</th><th class="px-4 py-3 text-right">Q2</th><th class="px-4 py-3 text-right">Q3</th><th class="px-4 py-3 text-right">Q4</th><th class="px-4 py-3 text-right font-black text-gray-800 dark:text-white">TOT</th><th class="px-4 py-3 text-right font-black">TGL</th></tr>
                </thead><tbody>`;
            gameState.players.forEach(p => {
                html += `<tr class="border-b dark:border-gray-700/50">
                    <td class="px-4 py-2 font-black text-yellow-500">${p.number}</td>
                    <td class="px-4 py-2 font-bold">${p.name}</td>
                    <td class="px-4 py-2 text-right opacity-60">${formatTime(calcQuarterMs(p, 'Q1'))}</td>
                    <td class="px-4 py-2 text-right opacity-60">${formatTime(calcQuarterMs(p, 'Q2'))}</td>
                    <td class="px-4 py-2 text-right opacity-60">${formatTime(calcQuarterMs(p, 'Q3'))}</td>
                    <td class="px-4 py-2 text-right opacity-60">${formatTime(calcQuarterMs(p, 'Q4'))}</td>
                    <td class="px-4 py-2 text-right font-black text-gray-900 dark:text-white">${formatTime(calcTotalMs(p))}</td>
                    <td class="px-4 py-2 text-right font-black">${calcTGL(p)}</td>
                </tr>`;
            });
            document.getElementById('total-stats-area').innerHTML = html + `</tbody></table>`;
        }

        function renderTimeline() {
            const container = document.getElementById('rotation-timeline');
            container.innerHTML = '';
            const totalMs = 40 * 60000;

            gameState.players.forEach(p => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-3";
                const label = `<span class="w-6 text-[10px] font-black text-gray-500">${p.number}</span>`;
                const bar = document.createElement('div');
                bar.className = "timeline-bar flex-1";

                // Linee Quarti
                [0.25, 0.5, 0.75].forEach(pos => {
                    const line = document.createElement('div');
                    line.className = "quarter-line";
                    line.style.left = (pos * 100) + "%";
                    bar.appendChild(line);
                });

                p.performance.forEach(perf => {
                    const qIdx = ['Q1','Q2','Q3','Q4'].indexOf(perf.quarter);
                    if (qIdx === -1) return;
                    const offset = qIdx * 600000;

                    perf.rotations.forEach(r => {
                        let end = r.end !== null ? r.end : (perf.quarter === gameState.currentQuarter ? 600000 - gameState.quarterTimes[perf.quarter] : 0);
                        const startPct = ((offset + r.start) / totalMs) * 100;
                        const widthPct = ((end - r.start) / totalMs) * 100;

                        if (widthPct > 0) {
                            const segment = document.createElement('div');
                            segment.className = "stint-segment";
                            segment.style.left = `${startPct}%`;
                            segment.style.width = `${widthPct}%`;
                            bar.appendChild(segment);
                        }
                    });
                });
                row.innerHTML = label;
                row.appendChild(bar);
                container.appendChild(row);
            });
        }

        function calcQuarterMs(p, q) {
            const perf = p.performance.find(x => x.quarter === q);
            if (!perf) return 0;
            return perf.rotations.reduce((acc, r) => {
                let end = r.end !== null ? r.end : (q === gameState.currentQuarter ? 600000 - gameState.quarterTimes[q] : 0);
                return acc + Math.max(0, end - r.start);
            }, 0);
        }

        function formatTime(ms) { 
            const s = Math.floor(Math.max(0, ms) / 1000); 
            return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; 
        }

        function adjustTime(ms) { 
            gameState.quarterTimes[gameState.currentQuarter] = Math.max(0, Math.min(600000, gameState.quarterTimes[gameState.currentQuarter] + ms)); 
            updateUI(); 
        }

        function exportToCSV() {
            let csv = "\uFEFFGiocatore;Numero;Q1;Q2;Q3;Q4;TOTALE;TGL;DETTAGLI STINT\n";
            const opponent = document.getElementById('opponent-name').value || "Partita";

            gameState.players.forEach(p => {
                let stints = [];
                p.performance.forEach(perf => {
                    perf.rotations.forEach(r => {
                        let end = r.end !== null ? r.end : (perf.quarter === gameState.currentQuarter ? 600000 - gameState.quarterTimes[perf.quarter] : 0);
                        stints.push(`${perf.quarter}: ${formatTime(600000 - r.start)}-${formatTime(600000 - end)}`);
                    });
                });

                const row = [
                    p.name, p.number,
                    formatTime(calcQuarterMs(p, 'Q1')),
                    formatTime(calcQuarterMs(p, 'Q2')),
                    formatTime(calcQuarterMs(p, 'Q3')),
                    formatTime(calcQuarterMs(p, 'Q4')),
                    formatTime(calcTotalMs(p)),
                    calcTGL(p),
                    `"${stints.join(" | ")}"`
                ];
                csv += row.join(";") + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Stats_${opponent}.csv`;
            link.click();
        }

        function initializeGame() {
            const lines = document.getElementById('player-input').value.split('\n');
            gameState.players = lines.map((l, i) => {
                const parts = l.trim().split(/[ .]+/);
                return { id: i, number: parts[0] || '??', name: parts.slice(1).join(' '), status: i < 5 ? 'court' : 'bench', performance: [] };
            }).filter(p => p.name);
            ['Q1','Q2','Q3','Q4','OT'].forEach(q => gameState.quarterTimes[q] = 600000);
            gameState.players.filter(p => p.status === 'court').forEach(p => p.performance = [{ quarter: 'Q1', rotations: [{ start: 0, end: null }] }]);
            document.getElementById('setup-modal').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            updateUI();
        }

        window.onload = () => {
            const saved = localStorage.getItem('basket_rotation_fivein_v2');
            if (saved) { gameState = JSON.parse(saved); document.getElementById('game-container').classList.remove('hidden'); updateUI(); }
            else document.getElementById('setup-modal').classList.remove('hidden');
        };
    </script>
</body>
</html>
